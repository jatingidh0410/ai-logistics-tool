version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nagarkot_postgres
    restart: always
    environment:
      POSTGRES_USER: nagarkot_user
      POSTGRES_PASSWORD: nagarkot_password
      POSTGRES_DB: nagarkot_shipments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagarkot_user -d nagarkot_shipments"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: nagarkot_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
